<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COLOR ??%</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   COLOR ??%  —  styles.css
   Museum / editorial / De Stijl-inspired design system.
   Palette: black, white, red, yellow, blue. No gradients, no glass, no neon.
   ========================================================================= */

:root {
  --black: #000000;
  --white: #FFFFFF;
  --red: #ED1C24;
  --yellow: #FFD800;
  --blue: #1557E8;
  --gray-line: #E4E4E4;
  --gray-mid: #B0B0B0;
  --gray-bg: #F6F6F4;

  --font-display: "Archivo Black", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", "Helvetica Neue", Arial, sans-serif;

  --step-1: 250ms;
  --step-2: 400ms;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--white);
  color: var(--black);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

button, input {
  font-family: inherit;
}

.visually-hidden {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}

/* ---------------------------- NAV ---------------------------- */
.site-nav {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 20px;
  background: var(--white);
  border-bottom: 2px solid var(--black);
}

.nav-logo {
  background: none;
  border: none;
  font-family: var(--font-display);
  font-size: 18px;
  letter-spacing: 0.02em;
  cursor: pointer;
  padding: 0;
  color: var(--black);
}

.nav-links {
  display: flex;
  gap: 18px;
}

.nav-link {
  background: none;
  border: none;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--black);
  cursor: pointer;
  padding: 6px 2px;
  position: relative;
  min-height: 44px;
}

.nav-link.is-active::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: 8px;
  height: 3px;
  background: var(--black);
}

/* ---------------------------- HOME ---------------------------- */
.view-home {
  display: flex;
  flex-direction: column;
  min-height: calc(100vh - 60px);
}

.mondrian-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr 1.5fr;
  grid-template-rows: 90px 60px 70px;
  grid-template-areas:
    "a b c"
    "a d e"
    "f d g";
  gap: 3px;
  padding: 3px;
  background: var(--black);
  border-bottom: 3px solid var(--black);
}

.block { display: block; width: 100%; height: 100%; }
.b-white { background: var(--white); }
.b-red { background: var(--red); }
.b-yellow { background: var(--yellow); }
.b-blue { background: var(--blue); }

.hero {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 60px 24px 80px;
}

.hero-title {
  font-family: var(--font-display);
  font-size: clamp(48px, 14vw, 96px);
  line-height: 0.95;
  letter-spacing: -0.01em;
  margin: 0;
}

.hero-sub-en {
  margin: 18px 0 4px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.14em;
}

.hero-sub-zh {
  margin: 0 0 40px;
  font-size: 15px;
  color: #4a4a4a;
}

.cta-row {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  justify-content: center;
}

.cta {
  min-width: 180px;
  min-height: 64px;
  border: 2px solid var(--black);
  background: var(--white);
  color: var(--black);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform var(--step-1) ease, background var(--step-1) ease, color var(--step-1) ease;
}

.cta-line1 { font-size: 11px; letter-spacing: 0.12em; font-weight: 600; }
.cta-line2 { font-family: var(--font-display); font-size: 18px; margin-top: 2px; }

.cta:active { transform: scale(0.97); }
.cta-primary:hover { background: var(--black); color: var(--white); }
.cta-secondary:hover { background: var(--gray-bg); }

/* ---------------------------- STEP INDICATOR ---------------------------- */
.step-indicator {
  display: flex;
  justify-content: space-between;
  padding: 20px 16px 8px;
  overflow-x: auto;
  gap: 4px;
}

.step-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  flex: 1;
  min-width: 46px;
}

.step-dot {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 2px solid var(--black);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  background: var(--white);
  color: var(--black);
  transition: background var(--step-1) ease, color var(--step-1) ease;
}

.step-dot.is-done { background: var(--black); color: var(--white); }
.step-dot.is-active { background: var(--black); color: var(--white); box-shadow: 0 0 0 3px var(--gray-bg); }

.step-label {
  font-size: 8px;
  letter-spacing: 0.06em;
  font-weight: 600;
  color: #666;
  text-align: center;
}

/* ---------------------------- FLOW / STEP PANELS ---------------------------- */
.flow-stage {
  padding: 8px 20px 60px;
  max-width: 640px;
  margin: 0 auto;
  animation: fadeSlideIn var(--step-2) ease;
}

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.step-heading {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin: 24px 0 6px;
}

.step-number {
  font-family: var(--font-display);
  font-size: 20px;
}

.step-heading h2 {
  font-family: var(--font-display);
  font-size: 26px;
  margin: 0;
}

.step-sub {
  font-size: 12px;
  letter-spacing: 0.08em;
  color: #666;
  margin: 0 0 24px;
}

.step-actions {
  margin-top: 32px;
}

.step-actions-split {
  display: flex;
  gap: 12px;
}

.step-actions-split .btn { flex: 1; }

.btn {
  min-height: 48px;
  padding: 0 18px;
  border: 2px solid var(--black);
  background: var(--white);
  color: var(--black);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.05em;
  cursor: pointer;
  transition: transform var(--step-1) ease, background var(--step-1) ease, color var(--step-1) ease, opacity var(--step-1) ease;
}

.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--black); color: var(--white); }
.btn-primary:hover { opacity: 0.85; }
.btn-outline:hover { background: var(--gray-bg); }
.btn-full { width: 100%; }
.btn-text {
  border: none;
  background: none;
  text-decoration: underline;
  font-size: 12px;
  color: #555;
}
.btn.is-disabled { opacity: 0.35; cursor: not-allowed; }

.field-error {
  color: var(--red);
  font-size: 12px;
  font-weight: 600;
  margin: 8px 0 0;
}

/* ---------------------------- PHOTO SLOTS ---------------------------- */
.photo-slots {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

@media (max-width: 520px) {
  .photo-slots { grid-template-columns: 1fr; }
}

.photo-slot-head {
  display: flex;
  flex-direction: column;
  margin-bottom: 8px;
}

.photo-slot-en { font-weight: 800; font-size: 13px; letter-spacing: 0.06em; }
.photo-slot-zh { font-size: 11px; color: #777; }

.photo-preview {
  aspect-ratio: 9/16;
  border: 2px solid var(--black);
  background: var(--gray-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  margin-bottom: 10px;
}

.photo-preview img {
  width: 100%; height: 100%; object-fit: cover;
  animation: photoIn var(--step-2) ease;
}

@keyframes photoIn {
  from { opacity: 0; transform: scale(0.96); }
  to { opacity: 1; transform: scale(1); }
}

.photo-placeholder {
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--gray-mid);
}

.photo-ready-badge {
  position: absolute;
  bottom: 8px; left: 8px;
  background: var(--black);
  color: var(--white);
  font-size: 10px;
  padding: 4px 8px;
  animation: checkIn var(--step-2) ease;
}

.photo-adjust-btn {
  position: absolute;
  top: 8px; right: 8px;
  background: var(--white);
  border: 1px solid var(--black);
  color: var(--black);
  font-size: 10px;
  font-weight: 700;
  padding: 5px 9px;
  cursor: pointer;
  min-height: 32px;
}

.crop-modal { max-width: 300px; }
.crop-hint { font-size: 11px; color: #666; margin: 0 0 12px; }
.crop-frame {
  overflow: hidden;
  border: 2px solid var(--black);
  position: relative;
  margin: 0 auto 16px;
  touch-action: none;
  background: var(--gray-bg);
}
.crop-img {
  position: absolute;
  top: 0; left: 0;
  max-width: none;
  will-change: transform;
}
.crop-zoom-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.crop-zoom-label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
.crop-zoom-slider { flex: 1; }

@keyframes checkIn {
  from { opacity: 0; transform: scale(0); }
  to { opacity: 1; transform: scale(1); }
}

.photo-btn-row {
  display: flex;
  gap: 8px;
}

.photo-btn-row .btn { flex: 1; padding: 0 8px; font-size: 11px; }

/* ---------------------------- CHECK STEP ---------------------------- */
.check-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

@media (max-width: 520px) {
  .check-row { grid-template-columns: 1fr; }
}

.check-card-label { font-weight: 800; font-size: 13px; margin-bottom: 8px; }

.check-photo-box {
  aspect-ratio: 9/16;
  border: 2px solid var(--black);
  overflow: hidden;
  margin-bottom: 10px;
}

.check-photo-box img { width: 100%; height: 100%; object-fit: cover; }

.check-list {
  list-style: none;
  padding: 0; margin: 0;
  font-size: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  color: #333;
}

/* ---------------------------- COLOR STEP ---------------------------- */
.color-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.color-card {
  aspect-ratio: 1;
  border: 2px solid var(--black);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  color: var(--white);
  position: relative;
  transition: transform var(--step-1) ease, border-width var(--step-1) ease;
}

.color-red { background: var(--red); }
.color-yellow { background: var(--yellow); color: var(--black); }
.color-blue { background: var(--blue); }

.color-card.is-selected {
  transform: scale(1.03);
  border-width: 4px;
}

.color-card-en { font-family: var(--font-display); font-size: 16px; }
.color-card-zh { font-size: 12px; }
.color-card-check {
  position: absolute; top: 8px; right: 8px;
  font-size: 16px;
  animation: checkIn var(--step-1) ease;
}

/* ---------------------------- ANALYZE ---------------------------- */
.step-panel-analyze {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 40px;
}

.analyze-anim {
  width: 220px; height: 220px;
  border: 2px solid var(--black);
  position: relative;
  margin: 30px 0;
  overflow: hidden;
  background:
    linear-gradient(var(--black) 1px, transparent 1px) 0 0 / 100% 33.33%,
    linear-gradient(90deg, var(--black) 1px, transparent 1px) 0 0 / 33.33% 100%;
}

.analyze-grid { position: relative; width: 100%; height: 100%; }

.a-block {
  position: absolute;
  width: 33.33%;
  height: 33.33%;
  animation: blockSlide 2.2s ease-in-out infinite;
}

.a-red { background: var(--red); top: 0; left: 0; animation-delay: 0s; }
.a-yellow { background: var(--yellow); top: 33.33%; left: 66.66%; animation-delay: 0.4s; }
.a-blue { background: var(--blue); top: 66.66%; left: 33.33%; animation-delay: 0.8s; }

@keyframes blockSlide {
  0%, 100% { opacity: 0.15; }
  50% { opacity: 1; }
}

.analyze-stage {
  font-size: 12px;
  letter-spacing: 0.1em;
  font-weight: 700;
}

/* ---------------------------- RESULT ---------------------------- */
.result-top {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 24px;
}

@media (max-width: 560px) {
  .result-top { grid-template-columns: 1fr; }
}

.result-photos { display: flex; gap: 10px; }

.result-photo {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 10px;
  letter-spacing: 0.08em;
  font-weight: 700;
  text-align: center;
}

.result-photo img {
  width: 100%;
  aspect-ratio: 9/16;
  object-fit: cover;
  border: 2px solid var(--black);
}

.result-score-block {
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.result-color-label {
  font-family: var(--font-display);
  font-size: 20px;
  letter-spacing: 0.05em;
}

.result-score-number {
  font-family: var(--font-display);
  font-size: clamp(48px, 12vw, 72px);
  margin: 4px 0 12px;
  line-height: 1;
}

.result-progress-track {
  height: 10px;
  background: var(--gray-bg);
  border: 1px solid var(--black);
  overflow: hidden;
}

.result-progress-fill { height: 100%; transition: width 0.05s linear; }

.bg-red { background: var(--red); }
.bg-yellow { background: var(--yellow); }
.bg-blue { background: var(--blue); }
.text-red { color: var(--red); }
.text-yellow { color: #B8940A; }
.text-blue { color: var(--blue); }

.result-verdict {
  margin-top: 14px;
  font-family: var(--font-display);
  font-size: 16px;
}
.verdict-low { animation: shake 0.4s ease; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

.result-breakdown {
  border-top: 2px solid var(--black);
  padding-top: 14px;
  margin-bottom: 24px;
}

.breakdown-row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  font-size: 13px;
  font-weight: 600;
  border-bottom: 1px solid var(--gray-line);
}

.breakdown-final { font-weight: 800; font-size: 15px; }

.formula-line {
  font-size: 11px;
  color: #666;
  margin-top: 10px;
}

.formula-standard { font-weight: 700; color: var(--black); }

.result-analysis-info {
  border: 1px solid var(--gray-line);
  padding: 14px;
  margin-bottom: 20px;
}

.analysis-info-title {
  font-size: 11px;
  letter-spacing: 0.1em;
  font-weight: 800;
  margin: 0 0 8px;
}

.analysis-info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  row-gap: 6px;
  font-size: 12px;
}

.mask-section { margin-bottom: 20px; border-top: 1px solid var(--gray-line); padding-top: 14px; }
.mask-title { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; margin: 0 0 8px; }
.mask-row { display: flex; gap: 12px; margin-top: 4px; }
.mask-item { flex: 1; text-align: center; font-size: 10px; font-weight: 700; }
.mask-item img { width: 100%; border: 1px solid var(--black); background: var(--black); }
.mask-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.legend-chip { display: flex; align-items: center; gap: 5px; font-size: 10px; color: #555; }
.legend-swatch { width: 10px; height: 10px; display: inline-block; border: 1px solid var(--black); }
.legend-swatch-gray { background: #b0b0b0; }
.legend-swatch-black { background: var(--black); }

/* ---------------------------- SAVE ---------------------------- */
.field-label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; margin-bottom: 6px; }
.text-input {
  width: 100%;
  min-height: 48px;
  padding: 0 14px;
  border: 2px solid var(--black);
  font-size: 14px;
  margin-bottom: 14px;
  background: var(--white);
  color: var(--black);
}
.notice-text { font-size: 11px; color: #666; margin-bottom: 18px; line-height: 1.5; }
.save-done { display: flex; gap: 10px; margin-top: 16px; }

/* ---------------------------- RANKING ---------------------------- */
.page-heading { padding: 30px 20px 10px; max-width: 720px; margin: 0 auto; }
.page-eyebrow { font-size: 11px; letter-spacing: 0.12em; color: #888; }
.page-heading h2 { font-family: var(--font-display); font-size: 32px; margin: 4px 0 0; }

.filter-row {
  display: flex;
  gap: 8px;
  padding: 10px 20px 20px;
  max-width: 720px;
  margin: 0 auto;
  flex-wrap: wrap;
}

.filter-chip {
  min-height: 40px;
  padding: 0 16px;
  border: 2px solid var(--black);
  background: var(--white);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

.filter-chip.is-active { background: var(--black); color: var(--white); }

.ranking-list {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 20px 60px;
  display: flex;
  flex-direction: column;
}

.ranking-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 0;
  border-bottom: 1px solid var(--gray-line);
  background: none;
  border-left: none; border-right: none; border-top: none;
  text-align: left;
  cursor: pointer;
  animation: fadeSlideIn var(--step-2) ease;
}

.rank-number { font-family: var(--font-display); font-size: 16px; width: 26px; }

.rank-photo {
  width: 54px; height: 54px;
  border: 1px solid var(--black);
  overflow: hidden;
  flex-shrink: 0;
}
.rank-photo img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }

.rank-info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.rank-name { font-weight: 700; font-size: 14px; }
.rank-color { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; }
.rank-score { font-weight: 800; font-size: 16px; }
.rank-arrow { font-size: 20px; color: #999; }

.empty-state {
  text-align: center;
  padding: 60px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.empty-title { font-family: var(--font-display); font-size: 20px; margin: 0; }
.empty-sub { color: #777; margin: 0; }

/* ---------------------------- DETAIL ---------------------------- */
.view-detail { max-width: 720px; margin: 0 auto; padding: 20px 20px 80px; }
.back-link { margin-bottom: 16px; padding: 0; }
.detail-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.detail-head h2 { font-family: var(--font-display); font-size: 26px; margin: 0; }
.detail-color { font-weight: 800; font-size: 14px; }
.detail-score { font-family: var(--font-display); font-size: 22px; margin-left: auto; }

.detail-photos { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
.detail-photo { display: flex; flex-direction: column; gap: 6px; font-size: 11px; font-weight: 700; text-align: center; }
.detail-photo img { width: 100%; aspect-ratio: 9/16; object-fit: cover; border: 2px solid var(--black); }

.delete-zone { margin-top: 60px; text-align: center; }
.delete-link {
  background: none;
  border: none;
  font-size: 11px;
  color: #aaa;
  border-bottom: 1px solid #ccc;
  cursor: pointer;
  padding: 4px;
}

/* ---------------------------- ABOUT ---------------------------- */
.view-about { max-width: 720px; margin: 0 auto; padding-bottom: 60px; }
.about-block { padding: 20px; border-top: 1px solid var(--gray-line); }
.about-block h3 { font-family: var(--font-display); font-size: 16px; margin: 0 0 10px; }
.about-block p { font-size: 13px; line-height: 1.6; margin: 0 0 8px; color: #333; }
.about-block p.zh { color: #666; }

.how-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.how-list li { display: flex; gap: 12px; align-items: baseline; font-size: 13px; }
.how-num { font-family: var(--font-display); font-size: 14px; }

.wheel-block { display: flex; flex-direction: column; align-items: center; }
.hue-wheel {
  width: 220px; height: 220px;
  border-radius: 50%;
  border: 2px solid var(--black);
  display: flex; align-items: center; justify-content: center;
  margin: 10px 0 16px;
}
.hue-wheel-center {
  width: 90px; height: 90px;
  background: var(--white);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; text-align: center;
  white-space: pre-line;
  border: 2px solid var(--black);
}
.wheel-legend { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; font-size: 11px; font-weight: 700; }
.legend-item { color: #666; }

.standards-grid { display: flex; flex-direction: column; gap: 20px; }
.standard-card { border: 1px solid var(--gray-line); padding: 14px; }
.standard-card h3 { margin-bottom: 10px; }
.standard-row {
  display: grid;
  grid-template-columns: 16px 90px 1fr 44px;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  padding: 4px 0;
}
.standard-swatch { width: 16px; height: 16px; border: 1px solid var(--black); }
.standard-range { font-weight: 700; }
.standard-weight { text-align: right; font-weight: 700; }

/* ---------------------------- MODAL ---------------------------- */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  padding: 20px;
  animation: fadeSlideIn var(--step-1) ease;
}
.modal {
  background: var(--white);
  border: 2px solid var(--black);
  padding: 24px;
  max-width: 320px;
  width: 100%;
}
.modal-title { font-family: var(--font-display); font-size: 16px; margin: 0 0 8px; }
.modal-sub { font-size: 12px; color: #666; margin: 0 0 16px; }
.modal-actions { display: flex; gap: 10px; margin-top: 12px; }
.modal-actions .btn { flex: 1; }

/* ---------------------------- CELEBRATION ---------------------------- */
.celebrate-layer {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 200;
  overflow: hidden;
}
.celebrate-piece {
  position: absolute;
  top: -20px;
  width: 12px; height: 12px;
  animation: fall 1.4s ease-in forwards;
}
.c-red { background: var(--red); }
.c-yellow { background: var(--yellow); }
.c-blue { background: var(--blue); }
@keyframes fall {
  to { transform: translateY(110vh) rotate(180deg); opacity: 0.2; }
}

/* ---------------------------- TOAST ---------------------------- */
.toast {
  position: fixed;
  left: 50%; bottom: 24px;
  transform: translateX(-50%) translateY(20px);
  background: var(--black);
  color: var(--white);
  padding: 10px 18px;
  font-size: 12px;
  opacity: 0;
  transition: opacity var(--step-1) ease, transform var(--step-1) ease;
  z-index: 300;
  pointer-events: none;
}
.toast.is-visible { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------------------------- FOCUS STATES ---------------------------- */
button:focus-visible, input:focus-visible {
  outline: 3px solid var(--blue);
  outline-offset: 2px;
}

<body>
<div id="app-root"></div>
<script>
/* =========================================================================
   COLOR ??%  —  app.js
   Core logic: color standard, scoring engine, segmentation interface,
   storage manager, and UI flow controller.
   ========================================================================= */

/* -------------------------------------------------------------------------
   00. FIXED OFFICIAL COLOR STANDARD  —  COLOR_STANDARD_V1
   This object is the single source of truth for all scoring.
   It must never be edited per-session or per-user. Any future change to
   these ranges must ship as COLOR_STANDARD_V2, and old results keep the
   version they were scored under.
   ------------------------------------------------------------------------- */
const COLOR_STANDARD_VERSION = "COLOR_STANDARD_V4";

/* V2 change: binary CORE-only classification (TRANSITION band removed).
   Ranges confirmed by the user via the interactive hue-range picker.
   V4 change: hue ranges unchanged; skin exclusion is now per target color —
   adaptive CbCr cluster for RED, the V3 MediaPipe-label rule for YELLOW,
   none for BLUE (see V4 SKIN RULE below). */
const COLOR_STANDARD = {
  RED: {
    core: [
      [294, 360],
      [0, 20]
    ]
  },
  YELLOW: {
    core: [
      [35, 67]
    ]
  },
  BLUE: {
    core: [
      [180, 251]
    ]
  }
};

const SAT_MIN = 0.22; // below this = NON-TARGET (loosened from 0.30: fabric folds catching
                       // light desaturate toward white without changing hue — too strict a
                       // cutoff was dropping real target-color fabric, not just background)
const VAL_MIN = 0.12; // below this = NON-TARGET (loosened from 0.20: shadowed creases on the
                       // same fabric darken without changing hue)

const COLOR_HEX = {
  RED: [237, 28, 36],
  YELLOW: [255, 216, 0],
  BLUE: [21, 87, 232]
};

/* -------------------------------------------------------------------------
   01. HUE / WEIGHT CLASSIFICATION  (fixed, deterministic, no AI judgement)
   ------------------------------------------------------------------------- */
function isHueInRange(h, min, max) {
  if (min <= max) {
    return h >= min && h < max;
  }
  return h >= min || h < max;
}

function getColorWeight(h, s, v, targetColor) {
  if (s < SAT_MIN || v < VAL_MIN) {
    return 0;
  }
  const standard = COLOR_STANDARD[targetColor];
  if (!standard) return 0;

  for (const range of standard.core) {
    if (isHueInRange(h, range[0], range[1])) return 1.0;
  }
  return 0;
}

/* V4 SKIN RULE — per-target-color exclusion
   Skin (face + body) always belongs to the person area (denominator).
   A skin pixel scores ONLY if it is clearly paint / makeup. Measured on
   real photos, no single test separates skin from costume in every band:
     - RED band [294,20): overlaps skin in HUE (skin hue bulk 20–45°), but
       saturated red sits far outside skin chroma → adaptive CbCr cluster
       (below) excludes skin even when MediaPipe mislabels or fails to load.
     - YELLOW band [35,67): pale yellow fabric shares chroma AND hue AND
       saturation with skin (measured: 80% of skin hue sits 20–45°, fabric
       bulk 40–50°) — pixel-level separation does not exist. Only the
       MediaPipe semantic label (skin vs clothes) separates them → the V3
       label-based rule is kept for yellow.
     - BLUE band [180,251]: never overlaps skin → no exclusion needed. */
const SKIN_HUE_BAND = [350, 50];     // natural skin hue band (wraps past 0°)
const SKIN_PAINT_SAT_MIN = 0.62;     // inside that band, paint must be at least this saturated

function isNaturalSkinTone(h, s) {
  const inBand = h >= SKIN_HUE_BAND[0] || h < SKIN_HUE_BAND[1];
  return inBand && s < SKIN_PAINT_SAT_MIN;
}

/* Adaptive CbCr skin model (RED-target exclusion). Skin chroma is compact
   in CbCr and nearly luminance-independent; the cluster is fitted per photo
   on MediaPipe skin-class pixels, so it follows the photo's lighting.
   Exclusion applies to EVERY pixel via Mahalanobis distance — misclassified
   or unlabeled skin can no longer leak into a red score. Painted skin stays
   far from the cluster, so it still counts. With too few samples
   (< SKIN_MIN_SAMPLES px — MediaPipe unavailable, or fully covered person)
   a fixed literature cluster is used: weaker, but never silently off. */
const SKIN_MIN_SAMPLES = 500;
const SKIN_GLOBAL_MEAN = [103, 150];  // classic CbCr skin-cluster center
const SKIN_GLOBAL_STD = [16, 10];
const SKIN_MAHAL2_MAX = 9.21;         // chi-square(2 df, 99%)
const SKIN_VAR_FLOOR = 4;             // σ >= 2 per axis keeps the ellipse from degenerating on tight samples

function rgbToCbCr(r, g, b) {
  // r,g,b in 0..255
  return [
    128 - 0.168736 * r - 0.331264 * g + 0.5 * b,
    128 + 0.5 * r - 0.418688 * g - 0.081312 * b
  ];
}

function inverse2(a, b, c, d) {
  const det = a * d - b * c;
  return [d / det, -b / det, -c / det, a / det];
}

/* Fits this photo's CbCr skin cluster from MediaPipe skin-class pixels. */
function buildSkinModel(skinMask, mask, data, width, height) {
  const total = width * height;
  let n = 0, scb = 0, scr = 0;
  for (let p = 0; p < total; p++) {
    if (mask[p] !== 1 || !skinMask || skinMask[p] !== 1) continue;
    const i = p * 4;
    const [cb, cr] = rgbToCbCr(data[i], data[i + 1], data[i + 2]);
    scb += cb; scr += cr; n++;
  }
  if (n < SKIN_MIN_SAMPLES) {
    return { mode: "global", mean: SKIN_GLOBAL_MEAN,
             covInv: inverse2(SKIN_GLOBAL_STD[0] ** 2, 0, 0, SKIN_GLOBAL_STD[1] ** 2) };
  }
  const mean = [scb / n, scr / n];
  let vcb = 0, vcr = 0, vcbcr = 0;
  for (let p = 0; p < total; p++) {
    if (mask[p] !== 1 || !skinMask || skinMask[p] !== 1) continue;
    const i = p * 4;
    const [cb0, cr0] = rgbToCbCr(data[i], data[i + 1], data[i + 2]);
    const cb = cb0 - mean[0], cr = cr0 - mean[1];
    vcb += cb * cb; vcr += cr * cr; vcbcr += cb * cr;
  }
  vcb = Math.max(vcb / n, SKIN_VAR_FLOOR);
  vcr = Math.max(vcr / n, SKIN_VAR_FLOOR);
  const corrCap = Math.sqrt(vcb * vcr) * 0.95;
  vcbcr = Math.min(Math.max(vcbcr / n, -corrCap), corrCap);
  return { mode: "adaptive", mean, covInv: inverse2(vcb, vcbcr, vcbcr, vcr) };
}

function skinMahal2(cb, cr, model) {
  const dx = cb - model.mean[0], dy = cr - model.mean[1];
  return model.covInv[0] * dx * dx + (model.covInv[1] + model.covInv[2]) * dx * dy + model.covInv[3] * dy * dy;
}

function rgbToHsv(r, g, b) {
  // r,g,b in [0,1]
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const d = max - min;
  let h = 0;
  if (d !== 0) {
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
    if (h < 0) h += 360;
  }
  const s = max === 0 ? 0 : d / max;
  const v = max;
  return { h, s, v };
}

/* -------------------------------------------------------------------------
   02. PERSON SEGMENTATION — industry-standard approach
   getPersonMask(imgEl, width, height) is async and returns
   { mask, skinMask, width, height, source: "model" | "heuristic" }
     mask[p]     === 1  -> pixel belongs to the main person
     skinMask[p] === 1  -> pixel is face or body skin (model only)

   PRIMARY MASK — Bria RMBG-1.4 (Transformers.js, ONNX): a 1024×1024 image
   matting network. Far finer edges than category models — hair, limbs,
   props. ~44MB, downloaded once and cached. WebGPU only — when navigator.gpu
   is missing (every Safari before 26) RMBG is skipped entirely and MediaPipe
   takes over: single-threaded WASM can't run it fast enough (no COOP/COEP on
   GitHub Pages → no threads). Supplies the person mask edges (no labels).

   SKIN CLASSES + RECALL + FALLBACK MASK — Google MediaPipe Image Segmenter
   (Tasks Vision) with the "selfie_multiclass_256x256" model. A category
   model:
     0 background, 1 hair, 2 body-skin, 3 face-skin, 4 clothes, 5 others
   Runs alongside RMBG for three jobs: skin classes (2, 3) so unpainted
   skin stays out of the score while painted skin still counts; recall —
   its eroded interior is unioned into the RMBG mask to restore worn body
   parts RMBG sometimes drops whole; and fallback person mask if RMBG
   fails. CPU delegate on purpose: the GPU delegate is known to scramble
   the class order on iOS Safari.

   HOSTING NOTE: WASM runtimes load from jsdelivr, MediaPipe model (~16MB)
   from storage.googleapis.com, RMBG-1.4 (~44MB) from huggingface.co. A
   normal host (GitHub Pages etc.) allows all three. A sandboxed preview
   that blocks outside network requests will make both fail, and the app
   refuses to score (no silent color-heuristic fallback).
   ------------------------------------------------------------------------- */

const TASKS_VISION_BASE = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304";
const MULTICLASS_MODEL_URL =
  "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite";
const SEG_CLASS = { BACKGROUND: 0, HAIR: 1, BODY_SKIN: 2, FACE_SKIN: 3, CLOTHES: 4, OTHERS: 5 };

function withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(label + "-timeout")), ms))
  ]);
}

let imageSegmenterPromise = null;
function getImageSegmenter() {
  if (!imageSegmenterPromise) {
    imageSegmenterPromise = (async () => {
      const vision = await import(TASKS_VISION_BASE + "/vision_bundle.mjs");
      const fileset = await vision.FilesetResolver.forVisionTasks(TASKS_VISION_BASE + "/wasm");
      return vision.ImageSegmenter.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: MULTICLASS_MODEL_URL, delegate: "CPU" },
        runningMode: "IMAGE",
        outputCategoryMask: true,
        outputConfidenceMasks: false
      });
    })();
    imageSegmenterPromise.catch(() => { imageSegmenterPromise = null; });
  }
  return imageSegmenterPromise;
}

/* ---------------------------- RMBG-1.4 (primary) ---------------------------- */
const TRANSFORMERS_URL = "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";
const RMBG_MODEL_ID = "briaai/RMBG-1.4";

async function buildRMBG(device) {
  const tr = await import(TRANSFORMERS_URL);
  tr.env.allowLocalModels = false;
  const model = await tr.AutoModel.from_pretrained(RMBG_MODEL_ID, {
    config: { model_type: "custom" },
    dtype: "fp32",
    device
  });
  const processor = await tr.AutoProcessor.from_pretrained(RMBG_MODEL_ID, {
    config: {
      do_normalize: true,
      do_pad: false,
      do_rescale: true,
      do_resize: true,
      image_mean: [0.5, 0.5, 0.5],
      image_std: [1, 1, 1],
      feature_extractor_type: "ImageFeatureExtractor",
      resample: 2,
      rescale_factor: 0.00392156862745098,
      size: { width: 1024, height: 1024 }
    }
  });
  return { tr, model, processor };
}

let rmbgSegmenterPromise = null;
function getRMBGSegmenter() {
  if (!rmbgSegmenterPromise) {
    rmbgSegmenterPromise = (async () => {
      // Skip RMBG when WebGPU is missing: single-threaded WASM (GitHub Pages
      // can't send COOP/COEP → no threads) runs the 44MB fp32 model far too
      // slowly on phones — it would download, hit the 60s timeout, and fall
      // back to MediaPipe anyway. Go straight to MediaPipe instead.
      if (!navigator.gpu) throw new Error("webgpu-unavailable");
      try {
        return await buildRMBG("webgpu");
      } catch (e) {
        return await buildRMBG("wasm"); // WebGPU init can fail at runtime — retry on WASM
      }
    })();
    rmbgSegmenterPromise.catch(() => { rmbgSegmenterPromise = null; });
  }
  return rmbgSegmenterPromise;
}

/* Matte output is a soft alpha 0–255; >=128 counts as person. */
async function segmentPersonRMBG(imgEl, width, height) {
  const { tr, model, processor } = await getRMBGSegmenter();
  const c = document.createElement("canvas");
  c.width = width; c.height = height;
  c.getContext("2d").drawImage(imgEl, 0, 0, width, height);
  const image = await tr.RawImage.fromURL(c.toDataURL("image/png"));
  const { pixel_values } = await processor(image);
  const { output } = await model({ input: pixel_values });
  const matte = await tr.RawImage.fromTensor(output[0].mul(255).to("uint8")).resize(width, height);
  const mask = new Uint8Array(width * height);
  for (let p = 0; p < mask.length; p++) mask[p] = matte.data[p] >= 128 ? 1 : 0;
  return { mask };
}

/* Starts downloading the models in the background as soon as the page
   opens, so they're usually ready by the time the user reaches ANALYZE. */
function preloadSegmenter() {
  getImageSegmenter().catch(() => {});
  getRMBGSegmenter().catch(() => {});
}

async function segmentPersonModel(imgEl, width, height) {
  const segmenter = await withTimeout(getImageSegmenter(), 30000, "segmenter-load");
  const input = document.createElement("canvas");
  input.width = width; input.height = height;
  input.getContext("2d").drawImage(imgEl, 0, 0, width, height);

  const result = segmenter.segment(input);
  const categoryMask = result.categoryMask;
  const cats = categoryMask.getAsUint8Array();
  const mw = categoryMask.width, mh = categoryMask.height;

  const mask = new Uint8Array(width * height);
  const skinMask = new Uint8Array(width * height);
  for (let y = 0; y < height; y++) {
    const sy = Math.min(mh - 1, Math.floor(y * mh / height));
    for (let x = 0; x < width; x++) {
      const sx = Math.min(mw - 1, Math.floor(x * mw / width));
      const c = cats[sy * mw + sx];
      const p = y * width + x;
      if (c !== SEG_CLASS.BACKGROUND) mask[p] = 1;
      if (c === SEG_CLASS.FACE_SKIN || c === SEG_CLASS.BODY_SKIN) skinMask[p] = 1;
    }
  }
  if (typeof result.close === "function") result.close();
  else if (typeof categoryMask.close === "function") categoryMask.close();
  return { mask, skinMask };
}

function segmentPersonHeuristic(imageData) {
  const { data, width, height } = imageData;
  const total = width * height;

  function colorAt(p) {
    const i = p * 4;
    return [data[i], data[i + 1], data[i + 2]];
  }
  function dist(a, b) {
    const dr = a[0] - b[0], dg = a[1] - b[1], db = a[2] - b[2];
    return Math.sqrt(dr * dr + dg * dg + db * db);
  }
  function median(arr) {
    const s = arr.slice().sort((a, b) => a - b);
    return s[Math.floor(s.length / 2)];
  }

  const borderR = [], borderG = [], borderB = [];
  const step = Math.max(1, Math.floor(Math.min(width, height) / 60));
  for (let x = 0; x < width; x += step) {
    let c = colorAt(x); borderR.push(c[0]); borderG.push(c[1]); borderB.push(c[2]);
    c = colorAt((height - 1) * width + x); borderR.push(c[0]); borderG.push(c[1]); borderB.push(c[2]);
  }
  for (let y = 0; y < height; y += step) {
    let c = colorAt(y * width); borderR.push(c[0]); borderG.push(c[1]); borderB.push(c[2]);
    c = colorAt(y * width + (width - 1)); borderR.push(c[0]); borderG.push(c[1]); borderB.push(c[2]);
  }
  const bg = [median(borderR), median(borderG), median(borderB)];

  const THRESHOLD = 46;
  const isBackground = new Uint8Array(total);
  const visited = new Uint8Array(total);
  const queue = new Int32Array(total);
  let qTail = 0;

  function considerBackground(p) {
    if (visited[p]) return;
    visited[p] = 1;
    if (dist(colorAt(p), bg) < THRESHOLD) {
      isBackground[p] = 1;
      queue[qTail++] = p;
    }
  }

  for (let x = 0; x < width; x++) {
    considerBackground(x);
    considerBackground((height - 1) * width + x);
  }
  for (let y = 0; y < height; y++) {
    considerBackground(y * width);
    considerBackground(y * width + (width - 1));
  }

  let qHead = 0;
  while (qHead < qTail) {
    const p = queue[qHead++];
    const x = p % width, y = (p / width) | 0;
    if (x > 0) considerBackground(p - 1);
    if (x < width - 1) considerBackground(p + 1);
    if (y > 0) considerBackground(p - width);
    if (y < height - 1) considerBackground(p + width);
  }

  const mask = new Uint8Array(total);
  for (let p = 0; p < total; p++) mask[p] = isBackground[p] ? 0 : 1;
  return mask;
}

/* Keeps only the single largest connected blob of foreground pixels and
   drops everything else. Photos sometimes have a second person, mannequin,
   or cropped limb at the edge of frame (a neighboring product shot, someone
   else standing nearby); without this, that secondary shape gets scored as
   part of "the person" too. This runs after segmentation regardless of
   whether the mask came from the real model or the fallback heuristic, so
   it helps in both cases. */
function keepLargestComponent(mask, width, height) {
  const total = width * height;
  const visited = new Uint8Array(total);
  const queue = new Int32Array(total);
  const labels = new Int32Array(total).fill(-1);
  let bestLabel = -1, bestSize = 0, labelCount = 0;

  for (let start = 0; start < total; start++) {
    if (mask[start] !== 1 || visited[start]) continue;
    let qHead = 0, qTail = 0;
    queue[qTail++] = start;
    visited[start] = 1;
    let size = 0;
    const currentLabel = labelCount++;
    while (qHead < qTail) {
      const p = queue[qHead++];
      labels[p] = currentLabel;
      size++;
      const x = p % width, y = (p / width) | 0;
      if (x > 0 && !visited[p - 1] && mask[p - 1] === 1) { visited[p - 1] = 1; queue[qTail++] = p - 1; }
      if (x < width - 1 && !visited[p + 1] && mask[p + 1] === 1) { visited[p + 1] = 1; queue[qTail++] = p + 1; }
      if (y > 0 && !visited[p - width] && mask[p - width] === 1) { visited[p - width] = 1; queue[qTail++] = p - width; }
      if (y < height - 1 && !visited[p + width] && mask[p + width] === 1) { visited[p + width] = 1; queue[qTail++] = p + width; }
    }
    if (size > bestSize) { bestSize = size; bestLabel = currentLabel; }
  }

  const result = new Uint8Array(total);
  if (bestLabel === -1) return result;
  for (let p = 0; p < total; p++) result[p] = labels[p] === bestLabel ? 1 : 0;
  return result;
}

/* Erosion (min filter): shrinks a mask by `radius` px on every side.
   Two separable passes — horizontal mins, then vertical. */
function erodeMask(mask, width, height, radius) {
  const tmp = new Uint8Array(mask.length);
  const out = new Uint8Array(mask.length);
  for (let y = 0; y < height; y++) {
    const row = y * width;
    for (let x = 0; x < width; x++) {
      let v = 1;
      const x0 = Math.max(0, x - radius), x1 = Math.min(width - 1, x + radius);
      for (let i = x0; i <= x1; i++) { if (!mask[row + i]) { v = 0; break; } }
      tmp[row + x] = v;
    }
  }
  for (let x = 0; x < width; x++) {
    for (let y = 0; y < height; y++) {
      let v = 1;
      const y0 = Math.max(0, y - radius), y1 = Math.min(height - 1, y + radius);
      for (let j = y0; j <= y1; j++) { if (!tmp[j * width + x]) { v = 0; break; } }
      out[y * width + x] = v;
    }
  }
  return out;
}

/* FAIRNESS: every score must come from real segmentation. If BOTH models
   can't load, we do NOT silently score with a color heuristic (it lets
   background leak in and would make some entries incomparable). Instead
   we stop and tell the user why. */
const MODEL_UNAVAILABLE = "MODEL_UNAVAILABLE";
const MODEL_UNAVAILABLE_MSG = "AI 人物辨識模型無法載入，請用正式網址（例如 GitHub Pages）開啟網站，並確認網路連線";

async function getPersonMask(imgEl, width, height) {
  // PRIMARY: RMBG-1.4 matte (fine edges). MediaPipe runs alongside for skin
  // AND for recall: RMBG occasionally drops whole worn body parts (a raised
  // limb in costume, glove paws, a hood). Union with the ERODED MediaPipe
  // interior restores them, while erosion keeps MediaPipe's coarse 256×256
  // edge band out — so edge pixels stay RMBG-governed.
  try {
    const rmbgOut = await withTimeout(segmentPersonRMBG(imgEl, width, height), 60000, "rmbg");
    let mask = keepLargestComponent(rmbgOut.mask, width, height);
    let skinMask = null;
    try {
      const mp = await segmentPersonModel(imgEl, width, height);
      const mpPerson = keepLargestComponent(mp.mask, width, height);
      const radius = Math.max(3, Math.round(width / 200));
      const mpInterior = erodeMask(mpPerson, width, height, radius);
      for (let p = 0; p < mask.length; p++) if (mpInterior[p]) mask[p] = 1;
      mask = keepLargestComponent(mask, width, height);
      skinMask = mp.skinMask;
      for (let p = 0; p < width * height; p++) if (!mask[p]) skinMask[p] = 0;
    } catch (e) {
      // Skin classes unavailable — painted-skin rule degrades gracefully (skinMask = null).
    }
    return { mask, skinMask, width, height, source: "rmbg" };
  } catch (err) {
    console.warn("RMBG segmentation unavailable, falling back to MediaPipe:", err);
  }

  // FALLBACK: MediaPipe category mask (person + skin classes in one pass).
  let out;
  try {
    out = await segmentPersonModel(imgEl, width, height);
  } catch (err) {
    console.warn("Segmentation model unavailable:", err);
    const e = new Error(MODEL_UNAVAILABLE_MSG);
    e.code = MODEL_UNAVAILABLE;
    throw e;
  }
  const mask = keepLargestComponent(out.mask, width, height);
  const skinMask = out.skinMask;
  for (let p = 0; p < width * height; p++) if (!mask[p]) skinMask[p] = 0;
  return { mask, skinMask, width, height, source: "model" };
}

/* Quick check used only for the CHECK PHOTO step: how much of the frame
   the detected person occupies, and whether they reach near the top and
   bottom of the frame (a stand-in for "full body, head to toe" — real
   pose/keypoint detection isn't part of this model). */
async function computePersonFrameCoverage(imgEl) {
  const maxDim = 480;
  const naturalW = imgEl.naturalWidth || imgEl.width;
  const naturalH = imgEl.naturalHeight || imgEl.height;
  const scale = Math.min(1, maxDim / Math.max(naturalW, naturalH));
  const w = Math.max(1, Math.round(naturalW * scale));
  const h = Math.max(1, Math.round(naturalH * scale));
  const { mask } = await getPersonMask(imgEl, w, h);

  let minY = h, maxY = -1, count = 0;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (mask[y * w + x]) {
        count++;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (count === 0) return { topRatio: 1, bottomRatio: 0, coverage: 0 };
  return { topRatio: minY / h, bottomRatio: maxY / h, coverage: count / (w * h) };
}

/* -------------------------------------------------------------------------
   03. SCORING ENGINE
   ------------------------------------------------------------------------- */
const scoringEngine = {
  MAX_DIM: 1400,

  /**
   * Analyze a single photo (already-loaded <img>) against a target color.
   * Returns photo score (0-100, full precision), pixel counts, and a
   * visualization canvas data URL showing exactly what was measured.
   */
  async analyzePhoto(imgEl, targetColor) {
    const naturalW = imgEl.naturalWidth || imgEl.width;
    const naturalH = imgEl.naturalHeight || imgEl.height;
    const scale = Math.min(1, this.MAX_DIM / Math.max(naturalW, naturalH));
    const w = Math.max(1, Math.round(naturalW * scale));
    const h = Math.max(1, Math.round(naturalH * scale));

    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(imgEl, 0, 0, w, h);
    const imageData = ctx.getImageData(0, 0, w, h);
    const { mask, skinMask, source: maskSource } = await getPersonMask(imgEl, w, h);
    const data = imageData.data;

    let personPixels = 0;
    let weightedTarget = 0;

    const maskCanvas = document.createElement("canvas");
    maskCanvas.width = w; maskCanvas.height = h;
    const maskCtx = maskCanvas.getContext("2d");
    const maskOut = maskCtx.createImageData(w, h);
    const targetRgb = COLOR_HEX[targetColor] || [128, 128, 128];

    const skinModel = buildSkinModel(skinMask, mask, data, w, h);

    for (let p = 0; p < w * h; p++) {
      const i = p * 4;
      if (mask[p] === 1) {
        personPixels++;
        const isSkin = skinMask ? skinMask[p] === 1 : false;
        const r = data[i] / 255, g = data[i + 1] / 255, b = data[i + 2] / 255;
        const { h: hue, s, v } = rgbToHsv(r, g, b);
        let weight = getColorWeight(hue, s, v, targetColor);
        if (weight > 0 && targetColor === "RED") {
          // chroma-cluster exclusion — see V4 SKIN RULE above
          const [cb, cr] = rgbToCbCr(data[i], data[i + 1], data[i + 2]);
          if (skinMahal2(cb, cr, skinModel) < SKIN_MAHAL2_MAX) weight = 0;
        } else if (weight > 0 && targetColor === "YELLOW" && isSkin && isNaturalSkinTone(hue, s)) {
          weight = 0; // unpainted skin never scores
        }
        weightedTarget += weight;

        const col = weight === 1.0 ? targetRgb : [176, 176, 176];

        maskOut.data[i] = col[0];
        maskOut.data[i + 1] = col[1];
        maskOut.data[i + 2] = col[2];
        maskOut.data[i + 3] = 255;
      } else {
        maskOut.data[i] = 0;
        maskOut.data[i + 1] = 0;
        maskOut.data[i + 2] = 0;
        maskOut.data[i + 3] = 255;
      }
    }
    maskCtx.putImageData(maskOut, 0, 0);

    const score = personPixels > 0 ? (weightedTarget / personPixels) * 100 : 0;
    const personRatio = personPixels / (w * h);

    return {
      score,
      personPixels,
      weightedTarget,
      personRatio,
      maskDataUrl: maskCanvas.toDataURL("image/png"),
      maskSource,
      skinMode: skinModel.mode
    };
  },

  /**
   * FRONT and BACK are always weighted 50/50 regardless of photo size,
   * resolution, or how large the person appears in either photo.
   */
  calculateFinalScore(frontScore, backScore) {
    return (frontScore + backScore) / 2;
  },

  formatScore(score) {
    return score.toFixed(1);
  }
};

/* -------------------------------------------------------------------------
   04. STORAGE MANAGER — swappable abstraction (localStorage now, Supabase later)
   ------------------------------------------------------------------------- */
const STORAGE_KEY = "colorpct_results_v1";

const storageManager = {
  getResults() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  },
  saveResult(result) {
    try {
      const results = this.getResults();
      results.push(result);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(results));
      return true;
    } catch (e) {
      return false;
    }
  },
  deleteResult(id) {
    try {
      const results = this.getResults().filter(r => r.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(results));
      return true;
    } catch (e) {
      return false;
    }
  }
};

  function el(tag, attrs = {}, children = []) {
    const node = document.createElement(tag);
    Object.entries(attrs).forEach(([k, v]) => {
      if (k === "class") node.className = v;
      else if (k === "html") node.innerHTML = v;
      else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v);
    });
    (Array.isArray(children) ? children : [children]).forEach(c => {
      if (c == null) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);

    return node;

    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => resolve({ imgEl: img, dataUrl: reader.result });
        img.onerror = () => reject(new Error("decode-failed"));
        img.src = reader.result;
      };
      reader.onerror = () => reject(new Error("read-failed"));
      reader.readAsDataURL(file);
    });
  }

  function loadImageFromSrc(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();

    const naturalW = imgEl.naturalWidth || imgEl.width;

    const w = Math.max(1, Math.round(naturalW * scale));

    const canvas = document.createElement("canvas");

  /* ---------------------------- CROP / ZOOM MODAL ---------------------------- */
  function openCropModal(kind, loaded) {
    const FRAME_W = 216, FRAME_H = 384; // 9:16, matches the preview aspect
    const img = loaded.imgEl;
    const iw = img.naturalWidth || img.width;
    const ih = img.naturalHeight || img.height;
    const minScale = Math.max(FRAME_W / iw, FRAME_H / ih);
    const maxScale = minScale * 3;
    let scale = minScale;
    let tx = (FRAME_W - iw * scale) / 2;
    let ty = (FRAME_H - ih * scale) / 2;

    const overlay = el("div", { class: "modal-overlay" });
    const modal = el("div", { class: "modal crop-modal" });
    modal.appendChild(el("p", { class: "modal-title" }, "ADJUST PHOTO"));
    modal.appendChild(el("p", { class: "crop-hint" }, "拖曳移動、滑桿縮放，將人物置中對齊"));

    const frame = el("div", { class: "crop-frame", style: `width:${FRAME_W}px;height:${FRAME_H}px;` });
    const cropImg = el("img", { src: loaded.dataUrl, class: "crop-img", draggable: "false", alt: "" });
    cropImg.style.width = iw + "px";
    cropImg.style.height = ih + "px";
    frame.appendChild(cropImg);
    modal.appendChild(frame);

    function applyTransform() {
      cropImg.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
      cropImg.style.transformOrigin = "0 0";
    }
    function clamp() {
      const w = iw * scale, h = ih * scale;
      tx = Math.min(0, Math.max(FRAME_W - w, tx));
      ty = Math.min(0, Math.max(FRAME_H - h, ty));
    }
    applyTransform();

    let dragging = false, lastX = 0, lastY = 0;
    frame.addEventListener("pointerdown", (e) => {
      dragging = true; lastX = e.clientX; lastY = e.clientY;
      frame.setPointerCapture(e.pointerId);
    });
    frame.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      tx += e.clientX - lastX;
      ty += e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      clamp();
      applyTransform();
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach(ev => {
      frame.addEventListener(ev, () => { dragging = false; });
    });

    const zoomRow = el("div", { class: "crop-zoom-row" });
    const zoomSlider = el("input", { type: "range", min: "0", max: "100", value: "0", class: "crop-zoom-slider" });
    zoomSlider.addEventListener("input", () => {
      const t = parseInt(zoomSlider.value, 10) / 100;
      const newScale = minScale + t * (maxScale - minScale);
      const cx = FRAME_W / 2, cy = FRAME_H / 2;
      const imgX = (cx - tx) / scale, imgY = (cy - ty) / scale;
      scale = newScale;
      tx = cx - imgX * scale;
      ty = cy - imgY * scale;
      clamp();
      applyTransform();
    });
    zoomRow.appendChild(el("span", { class: "crop-zoom-label" }, "縮放"));
    zoomRow.appendChild(zoomSlider);
    modal.appendChild(zoomRow);

    const actions = el("div", { class: "modal-actions" }, [
      el("button", { class: "btn btn-outline", onclick: () => overlay.remove() }, "CANCEL"),
      el("button", {
        class: "btn btn-primary", onclick: () => {
          const outW = 810, outH = 1440;
          const canvas = document.createElement("canvas");
          canvas.width = outW; canvas.height = outH;
          const ctx = canvas.getContext("2d");
          const sx = -tx / scale, sy = -ty / scale;
          const sw = FRAME_W / scale, sh = FRAME_H / scale;
          ctx.drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.9);
          loadImageFromSrc(dataUrl).then((newImg) => {
            state[kind] = { imgEl: newImg, dataUrl };
            overlay.remove();
            render();
          }).catch(() => {
            overlay.remove();
            showToast("照片無法讀取，請重新選擇");
          });

    ]);
    modal.appendChild(actions);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
  }

      if (!data || !personItem || !bodyItem || !msgEl) continue;
      try {
        const r = await computePersonFrameCoverage(data.imgEl);
        const personOk = r.coverage > 0.04;
        const fullBodyOk = personOk && r.topRatio < 0.16 && r.bottomRatio > 0.84;
        personItem.textContent = (personOk ? "✓ " : "✗ ") + "PERSON DETECTED";
        bodyItem.textContent = (fullBodyOk ? "✓ " : "✗ ") + "FULL BODY";
        if (!personOk) {
          msgEl.textContent = "無法辨識人物，請重新選擇照片";
          allOk = false;
        } else if (!fullBodyOk) {
          msgEl.textContent = "照片不完整，請重新拍攝";
          allOk = false;
        } else {
          msgEl.textContent = "";
        }
      } catch (err) {
        personItem.textContent = "✗ PERSON DETECTED";
        bodyItem.textContent = "✗ FULL BODY";
        msgEl.textContent = err && err.code === MODEL_UNAVAILABLE ? MODEL_UNAVAILABLE_MSG : "照片不完整，請重新拍攝";
        allOk = false;
      }
    }
    if (allOk) continueBtn.classList.remove("is-disabled");
    else continueBtn.classList.add("is-disabled");
  }

        const frontResult = await scoringEngine.analyzePhoto(state.front.imgEl, state.color);
        const backResult = await scoringEngine.analyzePhoto(state.back.imgEl, state.color);
        const finalScore = scoringEngine.calculateFinalScore(frontResult.score, backResult.score);
        state.analysis = { front: frontResult, back: backResult, finalScore };
        setStep(5);
      } catch (err) {
        showToast(err && err.code === MODEL_UNAVAILABLE ? MODEL_UNAVAILABLE_MSG : "分析發生問題，請重新嘗試");
        setStep(3);
      }

  function animateResult(finalScore) {
    const numEl = document.getElementById("result-score-number");
    const fillEl = document.getElementById("result-progress-fill");
    const verdictEl = document.getElementById("result-verdict");
    if (!numEl || !fillEl) return;

    const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const duration = reduceMotion ? 0 : 900;
    const start = performance.now();

    function frame(now) {
      const t = duration === 0 ? 1 : Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      const current = finalScore * eased;
      numEl.textContent = current.toFixed(1) + "%";
      fillEl.style.width = current.toFixed(1) + "%";
      if (t < 1) requestAnimationFrame(frame);
      else {
        numEl.textContent = scoringEngine.formatScore(finalScore) + "%";
        fillEl.style.width = Math.min(100, finalScore) + "%";
        if (finalScore >= 80) {
          verdictEl.textContent = "GREAT!";
          verdictEl.classList.add("verdict-high");
          launchCelebration();
        } else if (finalScore >= 50) {
          verdictEl.textContent = "NICE!";
        } else {
          verdictEl.textContent = "OHH...";
          verdictEl.classList.add("verdict-low");
        }
      }
    }
    requestAnimationFrame(frame);
  }

  function launchCelebration() {
    const layer = el("div", { class: "celebrate-layer" });
    const colors = ["c-red", "c-yellow", "c-blue"];
    for (let i = 0; i < 9; i++) {
      const piece = el("span", { class: "celebrate-piece " + colors[i % 3] });
      piece.style.left = Math.random() * 100 + "%";
      piece.style.animationDelay = (Math.random() * 0.3) + "s";
      layer.appendChild(piece);
    }
    document.body.appendChild(layer);
    setTimeout(() => layer.remove(), 1600);
  }

    ]));

    wrap.appendChild(el("section", { class: "about-block" }, [
      el("h3", {}, "SAME PEOPLE. SAME STANDARD."),
      el("p", {}, "Every entry is scored with " + COLOR_STANDARD_VERSION + ". Photo size, resolution, and framing never change the FRONT / BACK weight."),
    ]));

    // Hue wheel
    const wheelWrap = el("section", { class: "about-block wheel-block" });
    wheelWrap.appendChild(el("h3", {}, COLOR_STANDARD_VERSION + " — HUE WHEEL"));
    const wheelGradient = buildWheelGradient();
    wheelWrap.appendChild(el("div", { class: "hue-wheel", style: `background: conic-gradient(from -90deg, ${wheelGradient})` }, [
      el("div", { class: "hue-wheel-center" }, "HUE\n0°–360°")
    ]));
    wheelWrap.appendChild(el("div", { class: "wheel-legend" }, [
      el("span", { class: "legend-item text-red" }, "RED 294°–20°"),
      el("span", { class: "legend-item text-yellow" }, "YELLOW 35°–67°"),
      el("span", { class: "legend-item text-blue" }, "BLUE 180°–251°"),
      el("span", { class: "legend-item" }, "NON-TARGET")
    ]));
    wrap.appendChild(wheelWrap);

    wrap.appendChild(el("section", { class: "about-block standards-grid" }, [
      renderStandardCard("RED", [
        ["294°–360°", "CORE", "100%", 327],
        ["0°–20°", "CORE", "100%", 10]
      ]),
      renderStandardCard("YELLOW", [
        ["35°–67°", "CORE", "100%", 51]
      ]),
      renderStandardCard("BLUE", [
        ["180°–251°", "CORE", "100%", 215]
      ])
    ]));

    wrap.appendChild(el("section", { class: "about-block" }, [
      el("h3", {}, "NON-TARGET"),
      el("p", {}, "Hue 20°–35°, 67°–180°, and 251°–294°, plus any pixel with saturation below 22% or value below 12%, always score 0% — including black, white, and gray.")
    ]));

    wrap.appendChild(el("section", { class: "about-block" }, [
      el("h3", {}, "SKIN & BODY PAINT"),
      el("p", {}, "Face and body skin are part of the person area. For RED, each photo's own skin cluster is fitted in CbCr space; pixels inside the cluster never score. For YELLOW, skin is excluded by the AI skin label. Painted skin counts in every color."),
      el("p", { class: "zh" }, "臉與皮膚都算在人物範圍內。紅色：以該照片自身的膚色聚類（CbCr 自適應模型）排除自然膚色；黃色：以 AI 皮膚標籤排除。彩繪皮膚一律計分。")
    ]));

    return wrap;
  }

  function buildWheelGradient() {
    const stops = [];
    const N = 72;
    for (let i = 0; i <= N; i++) {
      const h = (i / N) * 360;
      stops.push(`${hueColor(h)} ${(i / N) * 100}%`);
    }
    return stops.join(", ");
  }

  /* ------------------------------- TOAST ---------------------------------- */
  let toastTimer = null;
  function showToast(msg) {
    let t = document.getElementById("toast");
    if (!t) {
      t = el("div", { id: "toast", class: "toast" });
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add("is-visible");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("is-visible"), 2600);
  }

  function init() {
    render();
    preloadSegmenter();
  }

  return { init };
})();

document.addEventListener("DOMContentLoaded", App.init);

</script>
</body>
</html>
